<main [style.background-image]="'url(' + homeStore.backgroundImageUrl() + ')'">
  <div class="home-content">
    <div class="header-actions">
      <button class="login-btn" (click)="openLoginModal()">Se connecter</button>
    </div>
  </div>

  <app-auth-modal
    [isOpen]="isAuthModalOpen"
    [initialTab]="authModalTab"
    (closeModal)="closeAuthModal()"
  />
</main>
